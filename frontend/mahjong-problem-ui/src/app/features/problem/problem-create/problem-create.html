<div class="form-container">
<h2>{{ isEditMode ? '問題編集' : '問題登録' }}</h2>

<div *ngIf="errorMessage()" class="error-message">
  {{ errorMessage() }}
</div>

<div>
  <label>問題文</label><br>
  <input type="text" [(ngModel)]="questionText" class="explanation-width">
</div>

<br>

<div>
  <label>引用元</label><br>
  <select [(ngModel)]="sourceId" (ngModelChange)="onSourceChange($event)">
    <option [ngValue]="null">未選択</option>
    <option *ngFor="let source of sources()" [ngValue]="source.id">
      {{ source.name }}<ng-container *ngIf="source.author">（{{ source.author }}）</ng-container>
    </option>
  </select>
  <div class="field-gap"></div>
  <label>第何問目</label><br>
  <input type="number" [(ngModel)]="sourceNumber" min="1">
</div>

<br>

<div>
  <label>場</label><br>
  <select [(ngModel)]="ba">
    <option [ngValue]="null">未選択</option>
    <option value="east">東場</option>
    <option value="south">南場</option>
  </select>
  <div class="field-gap"></div>
  <label>家</label><br>
  <select [(ngModel)]="kaze">
    <option [ngValue]="null">未選択</option>
    <option value="east">東家</option>
    <option value="south">南家</option>
    <option value="west">西家</option>
    <option value="north">北家</option>
  </select>
  <div class="field-gap"></div>
  <label>巡目</label><br>
  <input type="number" [(ngModel)]="jun" min="1">
</div>

<br>

<div>
  <label>ドラを選択</label>
  <div *ngFor="let group of tileGroups" class="tile-palette-row">
    <button
      type="button"
      *ngFor="let code of group.tiles"
      class="tile-btn"
      (click)="selectDora(code)"
    >
      <img
        [src]="'assets/tiles/' + code + '.png'"
        [alt]="code"
        class="tile-image"
        [class.tile-selected-dora]="doraTile === code"
      >
    </button>
  </div>
</div>

<br>

<div>
  <label>牌を選択</label>
  <div *ngFor="let group of tileGroups" class="tile-palette-row">
    <button
      type="button"
      *ngFor="let code of group.tiles"
      class="tile-btn"
      (click)="addTile(code)"
    >
      <img [src]="'assets/tiles/' + code + '.png'" [alt]="code" class="tile-image">
    </button>
  </div>
</div>

<br>

<div>
  <label>手牌（クリックで正解牌を指定）</label>
  <div class="tehai-row">
    <div *ngFor="let code of tehai; let i = index" class="tehai-chip">
      <img
        [src]="'assets/tiles/' + code + '.png'"
        [alt]="code"
        class="tile-image"
        [class.tile-selected-answer]="answerTile === code"
        (click)="selectAnswer(i)"
      >
      <button type="button" class="tehai-remove" (click)="removeTile(i)">×</button>
    </div>
  </div>
</div>

<br>

<div>
  <label>解説</label><br>
  <textarea [(ngModel)]="explanation" class="explanation-textarea" rows="10"></textarea>
</div>

<br>

<div class="submit-row">
  <button type="button" class="submit-btn" (click)="createProblem()">{{ isEditMode ? '更新' : '登録' }}</button>
</div>

<p *ngIf="isEditMode">
  <a [routerLink]="['/problems', editingId]">問題詳細へ戻る</a>
</p>
<p *ngIf="!isEditMode">
  <a [routerLink]="['/problems']">一覧へ戻る</a>
</p>
</div>
